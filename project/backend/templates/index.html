<!DOCTYPE html>
<html>
<head>
    <title>Markdown Compiler IDE</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            --bg: #0b1020;
            --panel: rgba(255, 255, 255, 0.06);
            --panel2: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.10);
            --text: rgba(255, 255, 255, 0.92);
            --muted: rgba(255, 255, 255, 0.70);
            --accent: #7c5cff;
            --accent2: #00d4ff;
            --danger: #ff4d6d;
            --ok: #19c37d;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            --radius: 14px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(1200px 600px at 20% -10%, rgba(124, 92, 255, 0.35), transparent 60%),
                radial-gradient(900px 500px at 90% 0%, rgba(0, 212, 255, 0.25), transparent 55%),
                linear-gradient(180deg, #070a12, var(--bg));
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .toolbar {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            background: rgba(10, 14, 28, 0.70);
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 260px;
        }
        .brand .title { font-weight: 700; letter-spacing: 0.2px; }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="file"] {
            color: var(--muted);
            max-width: 220px;
        }

        .toolbar-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            transition: background 120ms ease, border-color 120ms ease;
            font-size: 14px;
        }
        .toolbar-select option {
            color: black;
            background: white;
        }
        .toolbar-select:hover { background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.16); }
        .toolbar-select:focus { box-shadow: inset 0 0 0 1px rgba(124, 92, 255, 0.45); }

        button {
            border: 1px solid var(--border);
            padding: 10px 14px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            cursor: pointer;
            transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
        }
        button:hover { background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.16); }
        button:active { transform: translateY(1px); }
        button.primary {
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 10px 24px rgba(124, 92, 255, 0.18);
        }
        button.primary:hover { filter: brightness(1.04); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .status {
            font-size: 12px;
            color: var(--muted);
            min-width: 140px;
            text-align: right;
        }
        .status.good { color: rgba(25, 195, 125, 0.9); }
        .status.bad { color: rgba(255, 77, 109, 0.95); }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 14px;
            height: calc(100vh - 64px);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .panel-header {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid var(--border);
        }
        .panel-header .label { font-weight: 650; }
        .panel-header .hint { color: var(--muted); font-size: 12px; }

        .editor-body {
            flex: 1;
            min-height: 0;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: transparent; /* show highlighted layer instead */
            border: 0;
            outline: none;
            padding: 14px;
            position: relative;
            z-index: 2;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            caret-color: rgba(255, 255, 255, 0.92);
        }
        textarea:focus { box-shadow: inset 0 0 0 1px rgba(124, 92, 255, 0.45); }

        .editor-wrap {
            position: relative;
            height: 100%;
        }

        .editor-highlight {
            position: absolute;
            inset: 0;
            padding: 14px;
            margin: 0;
            overflow: auto;
            color: rgba(255, 255, 255, 0.92);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            pointer-events: none;
            background: rgba(10, 14, 28, 0.55);
        }

        .tok-heading { color: rgba(124, 92, 255, 0.95); font-weight: 650; }
        .tok-quote { color: rgba(0, 212, 255, 0.90); }
        .tok-list { color: rgba(255, 255, 255, 0.86); }
        .tok-code { color: rgba(25, 195, 125, 0.95); background: rgba(25, 195, 125, 0.12); border-radius: 8px; padding: 2px 6px; }
        .tok-bold { color: rgba(255, 255, 255, 0.98); font-weight: 700; }
        .tok-italic { color: rgba(255, 255, 255, 0.86); font-style: italic; }
        .tok-link { color: rgba(0, 212, 255, 0.95); text-decoration: underline; }
        .tok-image { color: rgba(255, 77, 109, 0.95); }
        .tok-fence { color: rgba(255, 255, 255, 0.88); background: rgba(255, 255, 255, 0.04); border-left: 3px solid rgba(124, 92, 255, 0.45); padding-left: 10px; }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tab {
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 999px;
            cursor: pointer;
            user-select: none;
            transition: background 120ms ease, transform 120ms ease, border-color 120ms ease;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.88);
        }

        .tab:hover { background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.16); }
        .tab:active { transform: translateY(1px); }

        .tab.active {
            background: linear-gradient(135deg, rgba(124, 92, 255, 0.28), rgba(0, 212, 255, 0.18));
            border-color: rgba(124, 92, 255, 0.35);
        }

        .code-output {
            margin: 0;
            padding: 0;
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: rgba(10, 14, 28, 0.55);
            color: rgba(255, 255, 255, 0.9);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 13px;
            line-height: 1.45;
        }

        .code-line {
            display: flex;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .code-ln {
            width: 46px;
            padding: 0 10px 0 14px;
            text-align: right;
            user-select: none;
            color: rgba(255, 255, 255, 0.35);
            flex: 0 0 auto;
        }
        .code-txt {
            flex: 1 1 auto;
            white-space: pre;
            padding-right: 14px;
        }

        /* Output syntax colors */
        .out-tag { color: rgba(124, 92, 255, 0.95); }
        .out-attr { color: rgba(0, 212, 255, 0.95); }
        .out-str { color: rgba(25, 195, 125, 0.95); }
        .out-num { color: rgba(255, 200, 87, 0.95); }
        .out-key { color: rgba(0, 212, 255, 0.92); }
        .out-bool { color: rgba(255, 77, 109, 0.92); }
        .out-punc { color: rgba(255, 255, 255, 0.55); }

        .output-body {
            flex: 1;
            min-height: 0;
            display: flex;
        }

        @media (max-width: 1000px) {
            .container { grid-template-columns: 1fr; height: calc(100vh - 64px); }
            input[type="file"] { max-width: 140px; }
            .brand { min-width: 0; }
        }
    </style>
</head>

<body>

<div class="toolbar">
    <div class="brand">
        <div class="title">Markdown Compiler IDE</div>
    </div>

    <div class="toolbar-actions">
        <select id="recentSelect" class="toolbar-select" onchange="loadRecent(this.value)">
            <option value="">Recent</option>
        </select>
        <input type="file" id="fileInput" />
        <select id="exportSelect" class="toolbar-select" onchange="handleExport(this)">
            <option value="">Export</option>
            <option value="html">Download HTML</option>
            <option value="typst">Download Typst</option>
            <option value="json">Download AST JSON</option>
            <option value="tokens">Download Tokens</option>
        </select>
        <button id="downloadBtn" onclick="downloadCurrent()" title="Download current output">Download</button>
        <button class="primary" id="runBtn" onclick="process()" title="Compile (Ctrl+Enter)">Run</button>
        <button id="clearBtn" onclick="clearEditor()" title="Clear editor (Ctrl+L)">Clear</button>
        <div id="status" class="status">Ready</div>
    </div>
</div>

<div class="container">

    <div class="panel">
        <div class="panel-header">
            <div>
                <div class="label">Editor</div>
            </div>
        </div>

        <div class="editor-body">
            <div class="editor-wrap">
                <div id="editorHighlight" class="editor-highlight" aria-hidden="true"></div>
                <textarea id="markdownInput" placeholder="Write Markdown..."></textarea>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <div>
                <div class="label">Output</div>
            </div>
            <div class="tabs">
                <div class="tab active" onclick="setView('html', this)">HTML</div>
                <div class="tab" onclick="setView('typst', this)">Typst</div>
                <div class="tab" onclick="setView('tokens', this)">Tokens</div>
                <div class="tab" onclick="setView('ast', this)">AST</div>
                <div class="tab" onclick="setView('json', this)">JSON</div>
                <div class="tab" onclick="openPreview()">Preview</div>
            </div>
        </div>

        <div class="output-body">
            <div id="output" class="code-output" data-placeholder="Run to see results…">Run to see results…</div>
        </div>
    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
